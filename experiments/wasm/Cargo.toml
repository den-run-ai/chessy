[package]
name = "chessy-ai-wasm"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Research-only candidate evaluator; see experiments/wasm/src/nnue.rs and
# tools/nnue/. Never enabled by the pinned production build.
nnue = []
# Variant: add the shipped lone-king mop-up term on top of the net output
# (nnue-v1-architecture.json requires net-only and net-plus-mop-up variants).
nnue-mopup = ["nnue"]

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"
strip = "symbols"

[profile.small]
inherits = "release"
opt-level = "z"
