name: Tests and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy the tested main-branch commit to GitHub Pages
        required: false
        type: boolean
        default: false
      nnue_synthetic_probe:
        description: 'Run diagnostic H4/H8 synthetic compiled size and cost probes (no trained candidate)'
        required: false
        type: boolean
        default: false
      nnue_incremental_probe:
        description: 'Run the separately registered H4/H8 fused/incremental synthetic study'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed merge-conflict markers
        # Exact marker syntax only — "<<<<<<< ref" / ">>>>>>> ref" and a
        # bare 7-char "=======" line — so legitimate ==== underlines or
        # longer separator lines never false-positive.
        # git grep exits 1 when nothing matches, which is the pass case.
        run: |
          if git grep -nE '^(<{7} |>{7} |={7}$)'; then
            echo '::error::Committed merge-conflict markers found'
            exit 1
          fi

  wasm-reproducibility:
    name: Rust tests + pinned WASM asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_VERSION: '1.97.1'
      RUST_COMMIT: 8bab26f4f68e0e26f0bb7960be334d5b520ea452
      RUST_MANIFEST_URL: https://static.rust-lang.org/dist/2026-07-16/channel-rust-1.97.1.toml
      RUST_MANIFEST_SHA256: 03569b1886ceb5c05276b50c8431ab111de944cd6140fe1fa7d821dd8e0f29cf
      BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
      BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Rust and Binaryen toolchains
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/rustup-home"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          curl -sSL -o rust-manifest.toml "$RUST_MANIFEST_URL"
          echo "$RUST_MANIFEST_SHA256  rust-manifest.toml" | sha256sum -c -
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target wasm32-unknown-unknown
          rustup run "$RUST_VERSION" rustc --version --verbose | tee rustc-version.txt
          grep -Fx "release: $RUST_VERSION" rustc-version.txt
          grep -Fx "commit-hash: $RUST_COMMIT" rustc-version.txt
          grep -Fx "LLVM version: 22.1.6" rustc-version.txt
          curl -sSL -o binaryen.tar.gz "$BINARYEN_URL"
          echo "$BINARYEN_SHA256  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz
      - name: Test Rust and build the production module
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          (cd experiments/wasm && cargo test --locked --offline)
          CHESSY_CARGO_TARGET_DIR="$RUNNER_TEMP/rust-target" \
            CHESSY_CARGO_BIN="$(command -v cargo)" \
            CHESSY_RUSTC_BIN="$(command -v rustc)" \
            CHESSY_WASM_OPT_BIN="$PWD/binaryen-version_131/bin/wasm-opt" \
            sh experiments/wasm/build.sh
          sha256sum experiments/wasm/dist/*.wasm
      - name: Verify the committed production asset
        run: cmp experiments/wasm/dist/chessy-ai-fast.wasm assets/chessy-ai-fast.wasm
      - name: Build all optional incremental study variants before timing
        if: (github.event_name == 'workflow_dispatch' && inputs.nnue_incremental_probe) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nnue-incremental-probe'))
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          mkdir "$RUNNER_TEMP/nnue-incremental-study" "$RUNNER_TEMP/nnue-incremental-results"
          for hidden in 4 8; do
            for mode in fused incremental; do
              probe="$RUNNER_TEMP/nnue-incremental-study/h$hidden-$mode"
              node tools/training/nnue-incremental.js prepare "$probe" "$hidden" "$mode"
              cp "$probe/incremental-source.json" "$RUNNER_TEMP/nnue-incremental-results/h$hidden-$mode-source.json"
              (cd "$probe" && cargo test --locked --offline nnue_)
              CHESSY_CARGO_TARGET_DIR="$RUNNER_TEMP/nnue-incremental-target" \
                CHESSY_CARGO_BIN="$(command -v cargo)" \
                CHESSY_RUSTC_BIN="$(command -v rustc)" \
                CHESSY_WASM_OPT_BIN="$PWD/binaryen-version_131/bin/wasm-opt" \
                sh "$probe/build.sh"
              cp "$probe/dist/chessy-ai-fast.wasm" "$RUNNER_TEMP/nnue-incremental-results/h$hidden-$mode.wasm"
            done
          done
      - name: Measure complete incremental study grid
        if: (github.event_name == 'workflow_dispatch' && inputs.nnue_incremental_probe) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nnue-incremental-probe'))
        run: |
          node tools/training/nnue-incremental.js measure-all "$RUNNER_TEMP/nnue-incremental-study" \
            "$RUNNER_TEMP/nnue-incremental-results/complete-study.json"
      - uses: actions/upload-artifact@v4
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.nnue_incremental_probe) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nnue-incremental-probe')))
        with:
          name: nnue-incremental-study
          path: ${{ runner.temp }}/nnue-incremental-results/
      - name: Measure optional synthetic NNUE mechanisms
        if: (github.event_name == 'workflow_dispatch' && inputs.nnue_synthetic_probe) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nnue-synthetic-probe'))
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          mkdir "$RUNNER_TEMP/nnue-probe-results"
          for hidden in 4 8; do
            for mode in refresh fused; do
              probe="$RUNNER_TEMP/nnue-probe-$hidden-$mode"
              node tools/training/nnue-phase-runtime.js prepare "$probe" "$hidden" "$mode"
              (cd "$probe" && cargo test --locked --offline nnue_research_parity)
              CHESSY_CARGO_TARGET_DIR="$RUNNER_TEMP/nnue-probe-target" \
                CHESSY_CARGO_BIN="$(command -v cargo)" \
                CHESSY_RUSTC_BIN="$(command -v rustc)" \
                CHESSY_WASM_OPT_BIN="$PWD/binaryen-version_131/bin/wasm-opt" \
                sh "$probe/build.sh"
              node tools/training/nnue-phase-runtime.js measure "$probe" \
                "$RUNNER_TEMP/nnue-probe-results/h$hidden-$mode.json"
              cp "$probe/synthetic-receipt.json" "$RUNNER_TEMP/nnue-probe-results/h$hidden-$mode-source.json"
              cp "$probe/dist/chessy-ai-fast.wasm" "$RUNNER_TEMP/nnue-probe-results/h$hidden-$mode.wasm"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.nnue_synthetic_probe) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nnue-synthetic-probe')))
        with:
          name: nnue-synthetic-probes
          path: ${{ runner.temp }}/nnue-probe-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-dist
          path: experiments/wasm/dist/

  release-gate:
    # Versioned cache entries are immutable: if executable content changes
    # without a release-token bump, controlled clients keep serving the old
    # cached bytes for the unchanged URL indefinitely. The in-tree token
    # agreement is checked by test/browser/sw-update.test.js; comparing
    # against the BASE revision requires CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Executable changes require a release-token bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch origin "$BASE_REF"
            changes_base=$(git merge-base "origin/$BASE_REF" HEAD)
            token_base="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = push ] &&
               [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            changes_base="$BEFORE_SHA"
            token_base="$BEFORE_SHA"
          else
            changes_base=HEAD^
            token_base=HEAD^
          fi
          node test/release-gate.js \
            --changes-base "$changes_base" --token-base "$token_base" --head HEAD

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ai-match-cli.test.js compares ABI-v2 against the frozen ABI-v1
          # WASM baseline from the merge base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Exact encoder for the byte-level Brotli size ratchet.
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run engine tests
        run: node test/engine.test.js
      - name: Replay exact Master screenshot incident
        run: node test/master-incident.test.js
      - name: Track known r69 Master e4 regression
        run: node test/master-e4-regression.test.js
      - name: Validate frozen E4-v1 protocol and manifest contracts
        run: |
          node test/eval/e4-protocol.test.js
          node test/eval/e4-stats.test.js
          node test/eval/e4-input-schemas.test.js
          node test/eval/prepare-e4-opening-candidates.test.js
          node test/eval/freeze-e4-manifests.test.js
      - name: Validate shared HCE/NNUE corpus and teacher adapters
        run: |
          node test/training/license-policy.test.js
          node test/training/corpus.test.js
          node test/training/label-stockfish.test.js
          node test/training/teacher-evidence.test.js
          node test/training/smoke-stockfish.test.js
          node test/training/generate-training-sample.test.js
      - name: Validate HCE R3 representation and NNUE G1 feature contracts
        run: |
          node test/training/hce-r3-features.test.js
          node test/training/hce-r3-linear.test.js
          node test/training/hce-r3-pack-stream.test.js
          node test/training/nnue-g1.test.js
      - name: Validate the NNUE trainer trust boundary
        run: |
          python -m py_compile tools/training/train-nnue.py
          python tools/training/train-nnue.py --self-test
      - name: Validate pinned convex HCE solver math
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          node --check test/training/hce-r3-pack-stream.js
          python -m py_compile tools/training/pack-hce.py
          python tools/training/pack-hce.py --self-test
          python tools/training/hce-fit.py --self-test
          python -m py_compile tools/training/sample-hce-convex.py
          python tools/training/sample-hce-convex.py --self-test
      - name: Validate natural-game research admission and output integrity
        run: |
          python -m pip install 'chess==1.11.2' 'zstandard==0.25.0'
          node test/training/hce-synthetic-pilot.test.js
          node test/training/natural-pilot-label.test.js
          python test/training/natural-select.test.py
          python test/training/natural-pilot-fit.test.py
          python test/training/audit-natural-labels.test.py
      - name: Validate private runtime export and complete measurement evidence
        run: |
          node test/training/natural-runtime-export.test.js
          node test/training/natural-runtime-run.test.js
          python test/training/audit-natural-runtime.test.py
      - name: Validate research-only H4 neural math and admission guards
        run: |
          python test/training/h4-model.test.py
          python test/training/h4-data.test.py
          python test/training/h4-screen.test.py
          python test/training/h4-ablation.test.py
          python test/training/h4-v2-model.test.py
          python test/training/h4-v2-screen.test.py
          python test/training/h4-v3-model.test.py
          python test/training/h4-v3-screen.test.py
          python test/training/h4-v3-audit.test.py
          python test/training/h4-v4-model.test.py
          python test/training/h4-v4-screen.test.py
          python test/training/h4-v4-audit.test.py
          python test/training/h4-v4-audit-stages.test.py
          python tools/training/audit-h4-v2.py --self-test
          node test/training/nnue-phase-runtime.test.js
          node test/training/nnue-incremental.test.js
          python tools/training/hybrid-selftest-v1.py
          python tools/training/hybrid-selftest-v1b.py
          python tools/training/hybrid-test-selftest-v1.py
          python test/training/hybrid-audit.test.py
          node test/training/hybrid-runtime.test.js
          node test/training/hybrid-match-v1.test.js
          node test/training/hybrid-runtime-fused.test.js
          node test/training/hybrid-runtime-lazy.test.js
          node test/training/hybrid-match-optimized-v1.test.js
          node test/training/hybrid-match-capture-v1.test.js
          node test/training/hybrid-match-recovery-v1.test.js
          python -m py_compile tools/training/audit-hybrid-test-v1.py tools/training/audit-hybrid-matches-v1.py tools/training/audit-hybrid-match-recovery-v1.py
      - name: Verify behavior-neutral AI telemetry
        run: node test/ai-telemetry.test.js
      - name: Verify the shipped WASM ABI and production asset
        run: node test/wasm-asset.test.js
      - name: Enforce the production WASM download-size ratchet
        run: node test/wasm-size.test.js
      - name: Verify frozen pre-removal WASM behavior
        run: node test/wasm-signatures.test.js
      - name: Verify recalibrated difficulty presets
        run: node test/level-presets.test.js
      - name: Run fixed-node AI tactics tests
        run: node test/ai-tactics.js
      - name: Run runtime-update gate tests
        run: node test/runtime-update.test.js
      - name: Verify release-token gate contract
        run: node test/release-gate.test.js
      - name: Install chess.js (dev-only independent legal-move oracle)
        # A SEPARATE rules implementation so the eval legalRoot axis is a true
        # differential, not the engine agreeing with itself. Dev/CI only; never
        # bundled into the offline app.
        run: npm install --no-save chess.js@1.4.0
      - name: Run eval-v1 correctness scorecard (frozen 64-case shard)
        # --baseline makes lost checks / a vacuous axis / a changed analysis
        # config fail the gate, not just new assertion failures.
        run: node test/eval/scorecard.js --baseline eval/BASELINE.json
      - name: Run eval-v1 analysis scorecard (E3, frozen 34-case train/val shard)
        # The E3 quality vector: two STRICT output contracts (complete/ordered
        # MultiPV over every legal root; self-consistent played-move rank +
        # classification) gate at 100%, and five QUALITY axes (puzzle top-1 /
        # recall@3, PV + budget stability, regret quantiles) ratchet from the
        # committed baseline. The accepted-move criterion identity and each
        # PR-shard puzzle's verdict/reason are an exact fixture: semantic drift
        # or lost coverage also fails here until consciously re-baselined.
        run: node test/eval/analysis-scorecard.js --baseline eval/ANALYSIS-BASELINE.json
      - name: Verify eval corpus is up to date with its generator
        # The committed ndjson/manifest must match a fresh generation (with the
        # oracle installed above), and the scorecard verifies the ndjson sha256
        # against the manifest at runtime.
        run: |
          node test/eval/gen-corpus.js
          if ! git diff --quiet -- eval/corpus/; then
            echo '::error::eval/corpus is stale — run `node test/eval/gen-corpus.js` and commit'
            git --no-pager diff --stat -- eval/corpus/
            exit 1
          fi
      - name: Validate frozen match openings
        run: node test/ai-match.js --check-openings
      - name: Validate prospective CC0 match-v2 holdout
        run: node test/ai-match-openings-v2.test.js
      - name: Verify match-v2 holdout grouping audit
        run: node test/ai-match-holdout-audit.test.js
      - name: Verify prospective match family map without search
        run: node test/ai-match-family-map.test.js
      - name: Validate v2 registration, raw replay and complete-shard contracts
        run: node test/ai-match-v2.test.js
      - name: Validate match protocol CLI and equal-time smoke
        run: node test/ai-match-cli.test.js
      - name: Run match cluster-statistics tests
        run: node test/match-stats.test.js
      - name: Run match shard-aggregator tests
        run: node test/ai-match-agg.test.js
      - name: Validate formal WASM efficiency match contract
        run: node test/wasm-efficiency-match.test.js
      - name: Run analysis-contract tests
        run: node test/analysis-core.test.js
      - name: Run PGN import tests
        run: node test/pgn.test.js
      - name: Run analysis-service tests
        run: node test/analysis-service.test.js
      - name: Run analysis-result trust-boundary tests
        run: node test/analysis-result.test.js
      - name: Run accepted-move criterion tests (Train v2 E1)
        run: node test/equivalence.test.js
      - name: Run structured Calculation contract tests (Train v2 E3)
        run: node test/calculation.test.js
      - name: Run critical-moment selector tests
        run: node test/moment-selector.test.js
      - name: Run score and move-annotation policy tests
        run: node test/analysis-notation.test.js
      - name: Run resumable moment-scan tests
        run: node test/moment-scan.test.js

  stockfish-teacher-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and run the pinned Stockfish 18 teacher
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          teacher=eval/training/teacher-sf18-100kn-v1.json
          archive_url=$(node -p "require('./$teacher').engine.archive.url")
          archive_name=$(node -p "require('./$teacher').engine.archive.path")
          archive_sha=$(node -p "require('./$teacher').engine.archive.sha256")
          executable_member=$(node -p "require('./$teacher').engine.executable.archivePath")
          archive="$RUNNER_TEMP/$archive_name"
          extract="$RUNNER_TEMP/stockfish-18"
          output="$RUNNER_TEMP/stockfish-smoke/sf18-100kn"
          sample="$RUNNER_TEMP/training-sample"
          baseline="$RUNNER_TEMP/hce-r3-baseline"
          mkdir -p "$extract" "$(dirname "$output")"
          exec > >(tee "$RUNNER_TEMP/stockfish-smoke/runner.log") 2>&1

          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" "$archive_url"
          printf '%s  %s\n' "$archive_sha" "$archive" | sha256sum -c -
          tar -xf "$archive" -C "$extract"
          executable="$extract/$executable_member"
          test -f "$executable"
          chmod +x "$executable"

          node test/training/smoke-stockfish.js \
            --archive "$archive" \
            --stockfish "$executable" \
            --output "$output"

          node test/training/generate-training-sample.js \
            --stockfish "$executable" \
            --output "$sample" \
            --profile preliminary

          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          node test/training/hce-r3-baseline.js \
            --output-dir "$baseline"
          python tools/training/sample-hce-convex.py \
            --sample-manifest "$sample/sample-manifest.json" \
            --center "$baseline/center.json" \
            --scales "$baseline/scales.json" \
            --output "$sample/preliminary-convex-diagnostic.json"
      - name: Upload teacher smoke and sample summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockfish18-100kn-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stockfish-smoke/runner.log
            ${{ runner.temp }}/stockfish-smoke/sf18-100kn.provenance.json
            ${{ runner.temp }}/stockfish-smoke/sf18-100kn.uci.log
            ${{ runner.temp }}/training-sample/sample-manifest.json
            ${{ runner.temp }}/training-sample/preliminary-convex-diagnostic.json
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WebKit runs alongside Chromium: the important historical failures
        # (emoji pawns, page scroll, service-worker lifetime) were iOS/Safari.
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (pinned)
        run: npm install --no-save playwright@1.61.1
      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run browser tests (${{ matrix.engine }})
        run: node test/browser/all.js
        env:
          BROWSER: ${{ matrix.engine }}

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_pages)
    needs: [hygiene, wasm-reproducibility, release-gate, engine, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
