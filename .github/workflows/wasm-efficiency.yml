# Formal efficiency non-inferiority gate for divergent Rust/WASM search
# candidates. It is intentionally marker-triggered: adding/updating the exact
# marker in a candidate pull request launches one predeclared
# 10,000-node, 100-opening x 4-seed x both-colours (800-game) experiment.
# Merely adding this workflow to the shared harness does not launch the match.
#
# Never rerun a valid statistical miss or selected shards. Change the candidate
# commit and marker for a genuinely new experiment; only an invalid
# infrastructure run may be replaced by a fresh complete run.

name: WASM fixed-node efficiency gate

on:
  pull_request:
    paths:
      - '.github/wasm-efficiency-run'

permissions:
  contents: read

concurrency:
  group: wasm-efficiency-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  PROTOCOL_ID: chessy-wasm-fixed-node-efficiency-10000x4x100x180-v1
  BASE_SHA: 808a2ef3e140718facd384acfebdd8781f1db162
  RUST_VERSION: '1.97.1'
  RUST_COMMIT: 8bab26f4f68e0e26f0bb7960be334d5b520ea452
  RUST_MANIFEST_URL: https://static.rust-lang.org/dist/2026-07-16/channel-rust-1.97.1.toml
  RUST_MANIFEST_SHA256: 03569b1886ceb5c05276b50c8431ab111de944cd6140fe1fa7d821dd8e0f29cf
  BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
  BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db

jobs:
  build:
    name: Build exact candidate and frozen-base modules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      candidate_sha: ${{ steps.provenance.outputs.candidate_sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bind marker, first attempt, and frozen provenance
        id: provenance
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Reruns are inadmissible; push a fresh marker commit for an invalid run"
            exit 2
          fi
          if [ ! -f .github/wasm-efficiency-run ]; then
            echo "::error::Missing exact efficiency-gate marker"
            exit 2
          fi
          if ! printf '%s\n' "$PROTOCOL_ID" |
            cmp -s - .github/wasm-efficiency-run; then
            echo "::error::Marker must contain exactly $PROTOCOL_ID"
            exit 2
          fi
          CANDIDATE_SHA=$(git rev-parse HEAD)
          git cat-file -e "$BASE_SHA^{commit}"
          if [ "$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")" != "$BASE_SHA" ]; then
            echo "::error::Candidate is not descended from frozen base $BASE_SHA"
            exit 2
          fi
          BASE_DIR="$RUNNER_TEMP/chessy-frozen-main"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          echo "BASE_DIR=$BASE_DIR" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'protocol %s\ncandidate %s\nfrozen base %s\n' \
            "$PROTOCOL_ID" "$CANDIDATE_SHA" "$BASE_SHA"

      - name: Install pinned Rust and Binaryen
        run: |
          set -euo pipefail
          export RUSTUP_HOME="$RUNNER_TEMP/rustup-home"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          curl -sSL -o "$RUNNER_TEMP/rust-manifest.toml" \
            "$RUST_MANIFEST_URL"
          echo "$RUST_MANIFEST_SHA256  $RUNNER_TEMP/rust-manifest.toml" |
            sha256sum -c -
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target wasm32-unknown-unknown
          rustup run "$RUST_VERSION" rustc --version --verbose |
            tee "$RUNNER_TEMP/rustc-version.txt"
          grep -Fx "release: $RUST_VERSION" \
            "$RUNNER_TEMP/rustc-version.txt"
          grep -Fx "commit-hash: $RUST_COMMIT" \
            "$RUNNER_TEMP/rustc-version.txt"
          grep -Fx "LLVM version: 22.1.6" \
            "$RUNNER_TEMP/rustc-version.txt"
          rustup run "$RUST_VERSION" cargo --version
          curl -sSL -o "$RUNNER_TEMP/binaryen.tar.gz" "$BINARYEN_URL"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/binaryen.tar.gz" |
            sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"

      - name: Test match contract and both Rust sources
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          node test/wasm-efficiency-match.test.js
          CARGO_BIN=$(rustup which --toolchain "$RUST_VERSION" cargo)
          RUSTC_BIN=$(rustup which --toolchain "$RUST_VERSION" rustc)
          (
            cd experiments/wasm
            RUSTC="$RUSTC_BIN" "$CARGO_BIN" test --locked --offline
          )
          (
            cd "$BASE_DIR/experiments/wasm"
            RUSTC="$RUSTC_BIN" "$CARGO_BIN" test --locked --offline
          )

      - name: Build and bind exact compared modules
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          CARGO_BIN=$(rustup which --toolchain "$RUST_VERSION" cargo)
          RUSTC_BIN=$(rustup which --toolchain "$RUST_VERSION" rustc)
          WASM_OPT_BIN="$RUNNER_TEMP/binaryen-version_131/bin/wasm-opt"
          MODULE_DIR="$RUNNER_TEMP/wasm-efficiency-modules"
          mkdir -p "$MODULE_DIR"
          RUSTC="$RUSTC_BIN" \
            CHESSY_CARGO_TARGET_DIR="$RUNNER_TEMP/rust-target-reference" \
            CHESSY_CARGO_BIN="$CARGO_BIN" \
            CHESSY_RUSTC_BIN="$RUSTC_BIN" \
            CHESSY_WASM_OPT_BIN="$WASM_OPT_BIN" \
            sh "$BASE_DIR/experiments/wasm/build.sh"
          cp "$BASE_DIR/experiments/wasm/dist/chessy-ai-fast.wasm" \
            "$MODULE_DIR/reference.wasm"
          RUSTC="$RUSTC_BIN" \
            CHESSY_CARGO_TARGET_DIR="$RUNNER_TEMP/rust-target-candidate" \
            CHESSY_CARGO_BIN="$CARGO_BIN" \
            CHESSY_RUSTC_BIN="$RUSTC_BIN" \
            CHESSY_WASM_OPT_BIN="$WASM_OPT_BIN" \
            sh experiments/wasm/build.sh
          cp experiments/wasm/dist/chessy-ai-fast.wasm \
            "$MODULE_DIR/candidate.wasm"
          (
            cd "$MODULE_DIR"
            sha256sum candidate.wasm reference.wasm | tee SHA256SUMS
            {
              echo "protocol-id=$PROTOCOL_ID"
              echo "candidate-sha=$CANDIDATE_SHA"
              echo "base-sha=$BASE_SHA"
            } > PROVENANCE
          )

      - name: Upload exact compared modules
        uses: actions/upload-artifact@v4
        with:
          name: wasm-efficiency-modules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm-efficiency-modules/
          if-no-files-found: error

  formal-shard:
    name: Formal shard (seed ${{ matrix.seedbase }}, opening block ${{ matrix.openbase }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seedbase: [0, 1, 2, 3]
        openbase: [0, 20, 40, 60, 80]
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.candidate_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download exact compared modules
        uses: actions/download-artifact@v4
        with:
          name: wasm-efficiency-modules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm-efficiency-modules

      - name: Verify and run formal shard
        env:
          CANDIDATE_SHA: ${{ needs.build.outputs.candidate_sha }}
          SEEDBASE: ${{ matrix.seedbase }}
          OPENBASE: ${{ matrix.openbase }}
          CHESSY_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Reruns are inadmissible; start a fresh complete experiment"
            exit 2
          fi
          MODULE_DIR="$RUNNER_TEMP/wasm-efficiency-modules"
          (
            cd "$MODULE_DIR"
            sha256sum -c SHA256SUMS
            grep -Fx "protocol-id=$PROTOCOL_ID" PROVENANCE
            grep -Fx "candidate-sha=$CANDIDATE_SHA" PROVENANCE
            grep -Fx "base-sha=$BASE_SHA" PROVENANCE
          )
          FILE="match-results-wasm-efficiency-s${SEEDBASE}-o${OPENBASE}.txt"
          node test/wasm-efficiency-match.js \
            --candidate-wasm "$MODULE_DIR/candidate.wasm" \
            --reference-wasm "$MODULE_DIR/reference.wasm" \
            --candidate-sha "$CANDIDATE_SHA" \
            --base-sha "$BASE_SHA" \
            --seedbase "$SEEDBASE" \
            --openbase "$OPENBASE" | tee "$FILE"

      - name: Upload formal shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-efficiency-shard-s${{ matrix.seedbase }}-o${{ matrix.openbase }}
          path: match-results-wasm-efficiency-s${{ matrix.seedbase }}-o${{ matrix.openbase }}.txt
          if-no-files-found: error

  formal-aggregate:
    name: Complete 800-game efficiency verdict
    needs: [build, formal-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.candidate_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all formal shards
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-efficiency-shard-*
          path: match-results
          merge-multiple: true

      - name: Enforce complete formal efficiency verdict
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Rerun artifacts are inadmissible; start a fresh complete experiment"
            exit 2
          fi
          files=()
          for seed in 0 1 2 3; do
            for opening in 0 20 40 60 80; do
              file="match-results/match-results-wasm-efficiency-s${seed}-o${opening}.txt"
              if [ ! -f "$file" ]; then
                echo "::error::Missing formal shard artifact $file"
                exit 5
              fi
              files+=("$file")
            done
          done
          count=$(find match-results -maxdepth 1 -type f \
            -name 'match-results-wasm-efficiency-*.txt' | wc -l)
          if [ "$count" -ne 20 ]; then
            echo "::error::Expected exactly 20 formal shard files, found $count"
            exit 5
          fi
          set +e
          node test/ai-match-agg.js "${files[@]}" | tee aggregate.txt
          status=${PIPESTATUS[0]}
          set -e
          cat aggregate.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload aggregate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-efficiency-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate.txt
          if-no-files-found: error
