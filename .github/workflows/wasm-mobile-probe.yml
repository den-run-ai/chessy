# Zig/WASM mobile-target reproduction probe (#84 / #113).
#
# Reproduces the successful WASM+Zig host experiment on the mobile browser
# stacks that GitHub-hosted runners can provide:
#   - node-host:        the original host checkpoint (parity + paired NPS)
#   - chromium/webkit:  desktop builds of the two mobile engine families
#                       (V8 = Android Chrome, JavaScriptCore = iOS Safari),
#                       plus a CPU-throttled Chromium minimum-device proxy
#   - android-emulator: REAL Chrome for Android on an x86_64 emulator (KVM)
#   - ios-simulator:    REAL Mobile Safari on an arm64 iOS Simulator
#
# What this run cannot establish (physical-device gate in #84/#113): real
# ARM SoC wall-time, 30-minute thermal soak, battery, jetsam/memory-pressure
# and watchdog behavior. Those still require physical hardware.
#
# Deliberately NOT wired into PR CI (repo convention for heavy tools):
# trigger manually, or by pushing to the experiment branch.

name: WASM mobile probe

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'bench depth (parity runs 1..depth)'
        default: '5'
      reps:
        description: 'paired AB/BA repetitions (even)'
        default: '2'
      min_ms:
        description: 'batch short searches to at least this many ms'
        default: '100'
      five:
        description: 'five-second diagnostic positions (0-4)'
        default: '4'
  push:
    branches:
      - claude/wasm-zig-mobile-validation-x0fwkv
    paths:
      - 'experiments/wasm/**'
      - '.github/workflows/wasm-mobile-probe.yml'

permissions:
  contents: read

env:
  DEPTH: ${{ github.event.inputs.depth || '5' }}
  REPS: ${{ github.event.inputs.reps || '2' }}
  MIN_MS: ${{ github.event.inputs.min_ms || '100' }}
  FIVE: ${{ github.event.inputs.five || '4' }}
  ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
  BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db

jobs:
  build:
    name: build (zig 0.16.0 + wasm-opt 131, reproducibility check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned toolchain
        run: |
          curl -sSL -o zig.tar.xz "$ZIG_URL"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          tar xf zig.tar.xz
          curl -sSL -o binaryen.tar.gz "$BINARYEN_URL"
          echo "$BINARYEN_SHA256  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz
      - name: Rebuild from source and compare with committed binaries
        run: |
          committed_fast=$(sha256sum experiments/wasm/chessy.wasm | cut -d' ' -f1)
          committed_size=$(sha256sum experiments/wasm/chessy-size.wasm | cut -d' ' -f1)
          ZIG="$PWD/zig-x86_64-linux-0.16.0/zig" \
            WASM_OPT="$PWD/binaryen-version_131/bin/wasm-opt" \
            experiments/wasm/build.sh
          rebuilt_fast=$(sha256sum experiments/wasm/chessy.wasm | cut -d' ' -f1)
          rebuilt_size=$(sha256sum experiments/wasm/chessy-size.wasm | cut -d' ' -f1)
          echo "committed fast: $committed_fast"
          echo "rebuilt   fast: $rebuilt_fast"
          echo "committed size: $committed_size"
          echo "rebuilt   size: $rebuilt_size"
          if [ "$committed_fast" != "$rebuilt_fast" ] || [ "$committed_size" != "$rebuilt_size" ]; then
            echo "::warning::committed wasm differs from a pinned-toolchain rebuild — probes still use the committed binary"
          fi
          git checkout -- experiments/wasm/chessy.wasm experiments/wasm/chessy-size.wasm experiments/wasm/chessy.wasm.provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-build-provenance
          path: experiments/wasm/chessy.wasm.provenance.txt

  host:
    name: node-host checkpoint (parity + paired NPS)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run host bench
        run: |
          mkdir -p probe-reports
          node experiments/wasm/bench.js --depth "$DEPTH" --reps "$REPS" \
            --min-ms "$MIN_MS" --five-second --json probe-reports/host-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-probe-host
          path: probe-reports/

  browser:
    name: ${{ matrix.name }} (desktop build of mobile engine family)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            engine: chromium
            throttle: 0
          - name: chromium-throttle4
            engine: chromium
            throttle: 4
          - name: webkit
            engine: webkit
            throttle: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (pinned, repo CI version)
        run: npm install --no-save playwright@1.61.1
      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run probe
        run: |
          mkdir -p probe-reports
          node experiments/wasm/probe/server.js --port 8123 \
            --out probe-reports &
          sleep 1
          node experiments/wasm/probe/run-playwright.js \
            --browser ${{ matrix.engine }} --throttle ${{ matrix.throttle }} \
            --depth "$DEPTH" --reps "$REPS" --min-ms "$MIN_MS" --five "$FIVE" \
            --target ${{ matrix.name }} \
            --json "probe-reports/final-${{ matrix.name }}.json" \
            --timeout 2400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-probe-${{ matrix.name }}
          path: probe-reports/

  android-emulator:
    name: android-chrome (real Chrome, x86_64 emulator, KVM)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run probe in Chrome for Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # 2.5 GB default RAM low-memory-killed Chrome mid-probe (run 2);
          # the differential workload needs headroom for the JS engine side.
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            OUT=probe-reports DEPTH=$DEPTH PARITY_DEPTH=$DEPTH REPS=$REPS MIN_MS=50 FIVE=$FIVE WAIT_S=2400 bash experiments/wasm/probe/run-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-probe-android-chrome
          path: probe-reports/

  ios-simulator:
    name: ios-safari (real Mobile Safari, arm64 iOS Simulator)
    runs-on: macos-15
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run probe in Mobile Safari (iOS Simulator)
        run: |
          OUT=probe-reports DEPTH=$DEPTH PARITY_DEPTH=$DEPTH REPS=$REPS \
            MIN_MS=$MIN_MS FIVE=$FIVE WAIT_S=2400 \
            bash experiments/wasm/probe/run-ios-sim.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-probe-ios-safari
          path: probe-reports/

  summary:
    name: aggregate verdicts
    runs-on: ubuntu-latest
    needs: [host, browser, android-emulator, ios-simulator]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-probe-*
          path: all-reports
      - name: Summarize
        run: |
          node experiments/wasm/probe/summarize.js all-reports summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-probe-summary
          path: summary.md
