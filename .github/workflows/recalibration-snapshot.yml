name: Apply verified recalibration proposal
on:
  push:
    branches: [codex/recalibrate-play-analysis]
    paths:
      - .github/workflows/recalibration-snapshot.yml
      - .recalibration-edits.json.gz
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-verified local edits and remove transfer scaffolding
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          root = Path.cwd().resolve()
          transfer = root / '.recalibration-edits.json.gz'
          raw = transfer.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '1d92b71b083162b834c8715faf62c9724c8a2fd49ae0d91f662a132a726c5afc'
          rows = json.loads(gzip.decompress(raw))
          assert len(rows) == 17
          prepared = []
          for row in rows:
              path = (root / row['path']).resolve()
              assert path.is_relative_to(root) and '.git' not in path.relative_to(root).parts
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == row['before'], row['path']
              lines = old.decode('utf-8').splitlines(keepends=True)
              last = len(lines) + 1
              for start, end, text in reversed(row['edits']):
                  assert 0 <= start <= end < last
                  lines[start:end] = [text]
                  last = start + 1
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == row['after'], row['path']
              prepared.append((path, new))
          for path, new in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          transfer.unlink()
          (root / '.github/workflows/recalibration-snapshot.yml').unlink()
          print('Applied all 17 hash-verified source edits; transfer scaffolding removed.')
          PY
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: propose clock-aware Master and stronger bounded analysis (draft)'
          git push origin HEAD:refs/heads/codex/recalibrate-play-analysis
