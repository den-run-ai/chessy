name: Recalibration source snapshot
on:
  push:
    branches: [codex/recalibrate-play-analysis]
    paths: [.github/workflows/recalibration-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact source revision
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/chessy-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/chessy-source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: recalibration-source
          path: |
            ${{ runner.temp }}/chessy-source.tar
            ${{ runner.temp }}/chessy-source-commit.txt
          retention-days: 1
