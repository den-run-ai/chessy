# Diagnostic screen for divergent Rust/WASM search experiments (#113).
#
# The candidate head and its exact origin/main merge-base are built
# independently with the same pinned toolchain. Performance verdicts are
# evidence, not CI pass/fail gates; malformed or incomplete measurements fail.
#
# TRUST SCOPE — diagnostic only. On pull_request and branch-push triggers,
# every input to this workflow is candidate-controlled: the workflow file
# itself (including the TRUSTED_* pins below), the checked-out sources, and
# the reported results. The pins, contract runs, and input freezes below are
# defense-in-depth hygiene that keeps honest experiments comparable; they
# cannot and do not certify evidence against an adversarial author, because
# a candidate commit can edit this file. Deep-screen output is therefore
# never merge-authoritative. Merge-authoritative efficiency evidence comes
# only from the formal v2 gate (wasm-efficiency.yml), which runs as
# maintainer-labeled pull_request_target with all verdict code taken from
# the trusted base revision, after human review of the exact candidate diff.

name: WASM deep-search experiment

on:
  workflow_dispatch:
    inputs:
      depth8_count:
        description: 'depth-8 bounded positions (0-4)'
        default: '4'
      fixed_pairs:
        description: 'fixed-depth AB/BA pairs (even)'
        default: '2'
      time_ms:
        description: 'time-to-depth budget per search'
        default: '5000'
      time_pairs:
        description: 'time-to-depth AB/BA pairs (even)'
        default: '2'
  push:
    branches:
      - 'agent/wasm-rust-deep-*'
    paths:
      - 'experiments/wasm/**'
      - 'test/ai-wasm-parity.js'
      - '.github/workflows/wasm-deep-search.yml'
  pull_request:
    paths:
      - 'experiments/wasm/**'
      - 'test/ai-wasm-parity.js'
      - '.github/workflows/wasm-deep-search.yml'

permissions:
  contents: read

concurrency:
  group: wasm-deep-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  DEPTH8_COUNT: ${{ github.event.inputs.depth8_count || '4' }}
  FIXED_PAIRS: ${{ github.event.inputs.fixed_pairs || '2' }}
  TIME_MS: ${{ github.event.inputs.time_ms || '5000' }}
  TIME_PAIRS: ${{ github.event.inputs.time_pairs || '2' }}
  RUST_VERSION: '1.97.1'
  RUST_COMMIT: 8bab26f4f68e0e26f0bb7960be334d5b520ea452
  RUST_MANIFEST_URL: https://static.rust-lang.org/dist/2026-07-16/channel-rust-1.97.1.toml
  RUST_MANIFEST_SHA256: 03569b1886ceb5c05276b50c8431ab111de944cd6140fe1fa7d821dd8e0f29cf
  BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
  BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db
  TRUSTED_DEEP_HARNESS_SHA: f44ce76dd6cc68a5ad4033b391aee0adea517086
  TRUSTED_BUILD_DRIVER_SHA256: 68852d6684eb69c2dc6fd59947f6e88450aa298fb13be96d48f09e6c79612489

jobs:
  compare:
    name: origin/main vs candidate (d7 + 5s)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Resolve exact origin/main baseline
        run: |
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          MAIN_TIP=$(git rev-parse refs/remotes/origin/main)
          BASE_SHA=$(git merge-base refs/remotes/origin/main HEAD)
          CANDIDATE_SHA=$(git rev-parse HEAD)
          BASE_DIR="$RUNNER_TEMP/chessy-origin-main"
          TRUSTED_DIR="$RUNNER_TEMP/chessy-deep-harness"
          git cat-file -e "$TRUSTED_DEEP_HARNESS_SHA^{commit}"
          if [ "$(git merge-base "$TRUSTED_DEEP_HARNESS_SHA" HEAD)" != \
              "$TRUSTED_DEEP_HARNESS_SHA" ]; then
            echo "::error::Candidate is not descended from the trusted deep harness"
            exit 2
          fi
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          git worktree add --detach "$TRUSTED_DIR" \
            "$TRUSTED_DEEP_HARNESS_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "MAIN_TIP=$MAIN_TIP" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "BASE_DIR=$BASE_DIR" >> "$GITHUB_ENV"
          echo "TRUSTED_DIR=$TRUSTED_DIR" >> "$GITHUB_ENV"
          printf 'candidate %s\nreference merge-base %s\ntrusted harness %s\ncurrent main %s\n' \
            "$CANDIDATE_SHA" "$BASE_SHA" "$TRUSTED_DEEP_HARNESS_SHA" \
            "$MAIN_TIP"

      - name: Freeze diagnostic build inputs
        run: |
          # The accounting contract verifies experiments/wasm/src, so the
          # remaining build-input surface (manifest, lockfile, toolchain
          # file, and the absence of build scripts or cargo config) must
          # match the pinned harness revision, or the compiled module could
          # come from sources the verifier never saw. Candidates that need
          # new build inputs must first land them in the harness.
          for input in Cargo.toml Cargo.lock rust-toolchain.toml; do
            if ! cmp -s "$TRUSTED_DIR/experiments/wasm/$input" \
                "experiments/wasm/$input"; then
              echo "::error::Candidate changed diagnostic build input $input"
              exit 2
            fi
          done
          for forbidden in experiments/wasm/build.rs \
              experiments/wasm/.cargo .cargo; do
            if [ -e "$forbidden" ]; then
              echo "::error::Candidate added unverified build input $forbidden"
              exit 2
            fi
          done

      - name: Install pinned Rust and Binaryen
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/rustup-home"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          curl -sSL -o "$RUNNER_TEMP/rust-manifest.toml" \
            "$RUST_MANIFEST_URL"
          echo "$RUST_MANIFEST_SHA256  $RUNNER_TEMP/rust-manifest.toml" |
            sha256sum -c -
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target wasm32-unknown-unknown
          rustup run "$RUST_VERSION" rustc --version --verbose |
            tee "$RUNNER_TEMP/rustc-version.txt"
          grep -Fx "release: $RUST_VERSION" \
            "$RUNNER_TEMP/rustc-version.txt"
          grep -Fx "commit-hash: $RUST_COMMIT" \
            "$RUNNER_TEMP/rustc-version.txt"
          grep -Fx "LLVM version: 22.1.6" \
            "$RUNNER_TEMP/rustc-version.txt"
          rustup run "$RUST_VERSION" cargo --version
          curl -sSL -o "$RUNNER_TEMP/binaryen.tar.gz" "$BINARYEN_URL"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/binaryen.tar.gz" |
            sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"

      - name: Test harness and both Rust sources
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          node "$TRUSTED_DIR/experiments/wasm/deep-bench.test.js"
          node "$TRUSTED_DIR/test/wasm-node-accounting-contract.js" \
            "$TRUSTED_DIR/experiments/wasm/src" \
            "$GITHUB_WORKSPACE/experiments/wasm/src"
          CARGO_BIN=$(rustup which --toolchain "$RUST_VERSION" cargo)
          RUSTC_BIN=$(rustup which --toolchain "$RUST_VERSION" rustc)
          (
            cd experiments/wasm
            RUSTC="$RUSTC_BIN" "$CARGO_BIN" test --locked --offline
          )
          (
            cd "$BASE_DIR/experiments/wasm"
            RUSTC="$RUSTC_BIN" "$CARGO_BIN" test --locked --offline
          )

      - name: Build exact reference and candidate modules
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          CARGO_BIN=$(rustup which --toolchain "$RUST_VERSION" cargo)
          RUSTC_BIN=$(rustup which --toolchain "$RUST_VERSION" rustc)
          WASM_OPT_BIN="$RUNNER_TEMP/binaryen-version_131/bin/wasm-opt"
          mkdir -p "$RUNNER_TEMP/deep-wasm"
          TRUSTED_DRIVER="$TRUSTED_DIR/experiments/wasm/build.sh"
          echo "$TRUSTED_BUILD_DRIVER_SHA256  $TRUSTED_DRIVER" |
            sha256sum -c -
          # Neither candidate nor older merge-base driver changes may bias
          # either side of the screen.
          cp "$TRUSTED_DRIVER" "$BASE_DIR/experiments/wasm/build.sh"
          cp "$TRUSTED_DRIVER" \
            experiments/wasm/build.sh
          RUSTC="$RUSTC_BIN" \
            CHESSY_CARGO_TARGET_DIR="$RUNNER_TEMP/rust-target-reference" \
            CHESSY_CARGO_BIN="$CARGO_BIN" \
            CHESSY_RUSTC_BIN="$RUSTC_BIN" \
            CHESSY_WASM_OPT_BIN="$WASM_OPT_BIN" \
            sh "$BASE_DIR/experiments/wasm/build.sh"
          cp "$BASE_DIR/experiments/wasm/dist/chessy-ai-fast.wasm" \
            "$RUNNER_TEMP/deep-wasm/reference.wasm"
          RUSTC="$RUSTC_BIN" \
            CHESSY_CARGO_TARGET_DIR="$RUNNER_TEMP/rust-target-candidate" \
            CHESSY_CARGO_BIN="$CARGO_BIN" \
            CHESSY_RUSTC_BIN="$RUSTC_BIN" \
            CHESSY_WASM_OPT_BIN="$WASM_OPT_BIN" \
            sh experiments/wasm/build.sh
          cp experiments/wasm/dist/chessy-ai-fast.wasm \
            "$RUNNER_TEMP/deep-wasm/candidate.wasm"
          sha256sum "$RUNNER_TEMP/deep-wasm/"*.wasm

      - name: Run divergent deep-search screen
        run: |
          mkdir -p deep-report
          {
            echo '> Diagnostic evidence only: on pull_request and push'
            echo '> triggers this workflow and its pins are'
            echo '> candidate-controlled. Merge-authoritative efficiency'
            echo '> evidence comes only from the maintainer-labeled formal'
            echo '> v2 gate.'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          node "$TRUSTED_DIR/experiments/wasm/deep-bench.js" \
            --candidate "$RUNNER_TEMP/deep-wasm/candidate.wasm" \
            --reference "$RUNNER_TEMP/deep-wasm/reference.wasm" \
            --candidate-label "$CANDIDATE_SHA" \
            --reference-label "$BASE_SHA" \
            --depth 7 \
            --fixed-pairs "$FIXED_PAIRS" \
            --depth8 "$DEPTH8_COUNT" \
            --time-ms "$TIME_MS" \
            --time-pairs "$TIME_PAIRS" \
            --warm-ms 250 \
            --json deep-report/report.json \
            --markdown deep-report/report.md
          cat deep-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and exact compared modules
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-deep-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deep-report/
            ${{ runner.temp }}/deep-wasm/
